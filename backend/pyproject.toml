[project]
name = "mutual-visibility-api"
version = "0.0.0"
description = "Backend environment for mutual astronomical visibility calculations"
requires-python = ">=3.14,<3.15"
dependencies = [
    "astropy>=8.0,<8.1",
    "fastapi>=0.141,<0.142",
    "numpy>=2,<3",
    "pydantic-settings>=2,<3",
    "uvicorn[standard]>=0.41,<0.42",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]
catalog = [
    "astroquery==0.4.11",
]
research = [
    "imageio[ffmpeg]>=2.37,<3",
    "matplotlib>=3.10,<4",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
