name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.14"

      - name: Install locked dependencies
        run: uv sync --project backend --locked

      - name: Lint
        run: uv run --project backend ruff check backend/app backend/tests

      - name: Check formatting
        run: uv run --project backend ruff format --check backend/app backend/tests

      - name: Test
        run: uv run --project backend pytest backend/tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace frontend

      - name: Test
        run: npm run test --workspace frontend

      - name: Build
        run: npm run build --workspace frontend
